# Generate the Xcode project with XcodeGen:
#   brew install xcodegen
#   cd App && xcodegen generate && open GoldBacktest.xcodeproj
#
# Signing (Team, Bundle ID) lives in Signing.xcconfig and your own
# Signing.local.xcconfig, written by ./save-signing.sh, so regenerating the
# project never loses it.
name: GoldBacktest
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BacktestKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GoldBacktest:
    type: application
    platform: iOS
    sources:
      - GoldBacktest
    dependencies:
      - package: BacktestKit
    scheme: {}
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: GoldBacktest
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Extra keys merged into the generated Info.plist (background audio for voice alerts).
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Aurum Pro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
