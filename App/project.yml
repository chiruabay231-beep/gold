# Generate the Xcode project with XcodeGen:
#   brew install xcodegen
#   cd App && xcodegen generate && open GoldBacktest.xcodeproj
name: GoldBacktest
options:
  bundleIdPrefix: com.gold
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BacktestKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GoldBacktest:
    type: application
    platform: iOS
    sources:
      - GoldBacktest
    dependencies:
      - package: BacktestKit
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gold.backtest
        PRODUCT_NAME: GoldBacktest
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer Team ID here or in Xcode > Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gold Backtest
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
